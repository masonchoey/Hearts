version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CHECKPOINT_PATH=${CHECKPOINT_PATH}
    volumes:
      - ./backend:/app/backend
      - ./PPO_2025-10-07_04-21-40:/app/PPO_2025-10-07_04-21-40  # Mount checkpoint directory
    networks:
      - hearts-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - hearts-network
    restart: unless-stopped

networks:
  hearts-network:
    driver: bridge


